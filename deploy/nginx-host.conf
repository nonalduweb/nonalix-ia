## Nonalix IA — vhost du Nginx de l'HÔTE (hors Docker).
##
## Installé par deploy/setup-host-nginx.sh dans
## /etc/nginx/sites-available/nonalixia.com puis lié dans sites-enabled/.
##
## Ce fichier est volontairement en HTTP seul : `certbot --nginx` y injecte
## ensuite les directives TLS et la redirection 443, exactement comme pour le
## vhost nonalix-ci.com déjà en place sur ce serveur. Ne pas y écrire de bloc
## ssl_certificate à la main — certbot ne saurait plus le mettre à jour.
##
## Le VPS héberge deux projets distincts. Celui-ci ne touche ni au vhost
## nonalix-ci.com, ni aux blocs `default_server` qui rejettent (444) les
## domaines inconnus et les accès par IP.

# Le vhost nonalix-ci.com force `Connection 'upgrade'` sur toutes les requêtes.
# Cette map est plus sûre : elle ne demande la bascule WebSocket que lorsque le
# client l'a réellement demandée, ce dont Reverb a besoin sans casser les
# requêtes HTTP ordinaires (keep-alive préservé).
map $http_upgrade $nonalixia_connection_upgrade {
    default upgrade;
    ''      close;
}

# www n'est pas routé par l'application : Laravel n'enregistre de routes que
# pour l'apex et les trois sous-domaines (Route::domain). Servi tel quel, il
# renverrait 404 à tout visiteur tapant www.nonalixia.com. Une redirection
# permanente vaut mieux qu'un alias : elle évite de servir le site commercial
# sous deux adresses, ce que les moteurs de recherche pénalisent.
server {
    listen 80;
    listen [::]:80;
    server_name www.nonalixia.com;

    return 301 https://nonalixia.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;

    # Pas de `default_server` : ces blocs existent déjà pour nonalix-ci.com et
    # en déclarer un second sur le même port empêcherait Nginx de démarrer.
    server_name nonalixia.com
                app.nonalixia.com admin.nonalixia.com api.nonalixia.com;

    # Les webhooks WhatsApp portent des charges utiles média volumineuses ;
    # la valeur par défaut de 1 Mo les rejetterait en 413.
    client_max_body_size 32M;

    location / {
        # Conteneur nonalix-web, publié sur la seule boucle locale.
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $nonalixia_connection_upgrade;
        # $host, et non $proxy_host : Laravel route sur le domaine demandé
        # (Route::domain). Le perdre ferait tomber les quatre espaces sur la
        # même table de routes et renverrait des 404 partout.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Seul l'hôte sait qu'il y a du TLS : sans cet en-tête, Laravel génère
        # des URL en http:// et les cookies `secure` ne reviennent jamais.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_cache_bypass $http_upgrade;

        # Une connexion WebSocket Reverb reste ouverte : sans ces délais, elle
        # serait coupée toutes les 60 s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
