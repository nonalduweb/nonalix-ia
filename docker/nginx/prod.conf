## Nonalix IA — vhost du conteneur web en production.
##
## Le TLS n'est PAS terminé ici. Le VPS a déjà un Nginx hôte qui occupe 80/443
## (il sert nonalix-ci.com) et un certbot système auto-renouvelé : c'est lui
## qui termine le TLS et relaie vers 127.0.0.1:8081, donc vers ce conteneur.
##
## Ce vhost ne voit donc que du HTTP en clair, sur le réseau local de Docker.
## Il ne doit jamais être publié directement sur une interface publique.
##
## Un seul vhost pour les quatre sous-domaines : le routage par domaine est
## fait par Laravel (Route::domain), pas par Nginx.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # -- Adresse réelle du client --------------------------------------------
    # Sans cela, chaque requête serait journalisée avec l'IP de la passerelle
    # Docker, et les limitations de débit de Laravel compteraient tous les
    # visiteurs comme un seul.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # -- En-têtes de sécurité ------------------------------------------------
    # HSTS est posé par le Nginx hôte, qui est le seul à parler TLS.
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Request-Id              $request_id                       always;

    # -- WebSocket Reverb ----------------------------------------------------
    location ~ ^/(app|apps)/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Reprend le schéma vu par l'hôte : c'est lui qui sait s'il y a du TLS.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # -- Assets compilés : cache long, ils sont hashés par Vite --------------
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # -- Application ---------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME   $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO         $fastcgi_path_info;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        # HTTPS n'est PAS forcé ici : c'est X-Forwarded-Proto, transmis par
        # l'hôte et honoré par trustProxies(at: '*'), qui fait foi. Le forcer
        # casserait tout accès direct en HTTP lors d'un diagnostic.

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        internal;
    }

    # Aucun autre .php n'est exécutable (défense en profondeur).
    location ~ \.php$ { return 404; }

    # Fichiers sensibles jamais servis.
    location ~ /\.(?!well-known).* { deny all; }
    location ~ ^/(storage/framework|bootstrap/cache|vendor)/ { deny all; }
}
