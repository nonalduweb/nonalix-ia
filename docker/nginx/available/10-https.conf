## Nonalix IA — vhost HTTPS de production.
##
## Activé par deploy/init-tls.sh UNIQUEMENT après émission du certificat :
## Nginx refuse de démarrer si ssl_certificate pointe sur un fichier absent.
##
## Un seul vhost pour les quatre sous-domaines : le routage est fait par
## Laravel (Route::domain), et le certificat est un SAN couvrant les quatre.

server {
    listen 443 ssl default_server;
    http2 on;
    server_name nonalixia.com app.nonalixia.com admin.nonalixia.com api.nonalixia.com;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # -- TLS -----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/nonalixia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nonalixia.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # -- En-têtes de sécurité ------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Request-Id              $request_id                       always;
    # includeSubDomains couvre app./admin./api. — n'activer preload qu'une fois
    # certain de ne jamais servir un sous-domaine en clair.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -- WebSocket Reverb ----------------------------------------------------
    location ~ ^/(app|apps)/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # -- Assets compilés : cache long, ils sont hashés par Vite --------------
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # -- Application ---------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME   $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO         $fastcgi_path_info;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        # Sans cela, Laravel génère des URL en http:// derrière la terminaison
        # TLS et les cookies `secure` ne repartent jamais.
        fastcgi_param HTTPS             on;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        internal;
    }

    # Aucun autre .php n'est exécutable (défense en profondeur).
    location ~ \.php$ { return 404; }

    # Fichiers sensibles jamais servis.
    location ~ /\.(?!well-known).* { deny all; }
    location ~ ^/(storage/framework|bootstrap/cache|vendor)/ { deny all; }
}
