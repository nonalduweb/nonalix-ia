## Nonalix IA — vhost HTTP de production.
##
## Deux rôles :
##   1. servir le challenge ACME (renouvellement Let's Encrypt sans coupure) ;
##   2. rediriger tout le reste vers HTTPS.
##
## Ce fichier reste actif en permanence, y compris une fois le TLS en place :
## certbot renouvelle par webroot sur le port 80.

server {
    listen 80 default_server;
    server_name nonalixia.com app.nonalixia.com admin.nonalixia.com api.nonalixia.com;

    # Le challenge doit rester en clair : il précède l'existence du certificat.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
