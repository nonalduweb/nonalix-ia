; Nonalix IA — réglages PHP applicatifs
memory_limit = 512M
max_execution_time = 120
max_input_time = 120

; Import de documents pour la base de connaissances (PDF, DOCX)
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 20

date.timezone = UTC

; Sécurité : ne jamais divulguer la version ni les erreurs en clair.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

; Sessions gérées par Redis via Laravel — ces réglages sont un filet de sécurité.
session.cookie_httponly = On
session.cookie_samesite = "Lax"
session.use_strict_mode = On

realpath_cache_size = 4096k
realpath_cache_ttl = 600
