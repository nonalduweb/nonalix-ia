[www]
user  = www-data
group = www-data

listen = 0.0.0.0:9000
listen.backlog = 512

; Dimensionnement : ~40 Mo par process, ajuster selon la RAM du conteneur.
pm = dynamic
pm.max_children      = 40
pm.start_servers     = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests      = 500

; Les logs partent sur la sortie standard du conteneur.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

clear_env = no

; Les webhooks Meta doivent répondre en moins de quelques secondes ;
; au-delà de 120 s c'est forcément un bug, on tue le worker.
request_terminate_timeout = 120
